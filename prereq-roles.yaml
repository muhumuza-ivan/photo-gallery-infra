AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Photo Gallery - the two roles the Git sync setup needs before it can run:
  the role CloudFormation assumes to build template.yaml, and the role the Git
  sync service assumes to read the repository and drive change sets.

  This is the one thing template.yaml cannot create for itself: CloudFormation
  needs a role in order to create resources, and that role cannot be created by
  the stack it enables. Deploy it once, by CLI, before creating the Git sync
  configuration:

    aws cloudformation deploy \
      --template-file prereq-roles.yaml \
      --stack-name photo-gallery-prereq \
      --capabilities CAPABILITY_NAMED_IAM

  It is deliberately NOT part of the Git sync flow: giving a deployment the
  power to rewrite its own permissions is the loop you do not want.

Parameters:
  ProjectName:
    Type: String
    Default: photo-gallery
    Description: Must match ProjectName in .cfn-deployments/main.yaml.
  StackName:
    Type: String
    Default: photo-gallery
    Description: >
      Name of the stack these roles may be used for. The trust policy is pinned
      to it, so a leaked role reference cannot be used to build a different stack.

  GitSyncConnectionArn:
    Type: String
    AllowedPattern: '^arn:aws[a-z-]*:code(star-)?connections:[a-z0-9-]+:\d{12}:connection/.+$'
    Description: >
      ARN of the GitHub connection created in the CloudFormation or Developer
      Tools console. Authorising a connection needs a human OAuth handshake, so
      it is the one step that cannot be scripted - everything after it can.

  GitSyncServicePrincipal:
    Type: String
    Default: cloudformation.sync.codeconnections.amazonaws.com
    Description: >
      Service principal allowed to assume the Git sync role. Confirmed by the
      sync configuration wizard, which rejects any other value with:
      "The supplied role ... does not trust cloudformation.sync.codeconnections
      .amazonaws.com".

      Two values that look right and are not:
        cloudformation.amazonaws.com                      - the CloudFormation
          EXECUTION role's principal (wizard step 1), not the sync role's.
        repository.sync.codeconnections.amazonaws.com      - what the
          AWSServiceRoleForGitSync service-linked role trusts. Different role,
          different purpose. Do not copy it.

      Getting this wrong fails loudly at the wizard, not silently, so a rebuild
      cannot quietly end up with a sync that never fires.

Resources:

  CfnExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-cfn-execution'
      Description: Assumed by CloudFormation to deploy the photo gallery stack.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              # Confused-deputy guards: only CloudFormation, only in this
              # account, and only when building this stack.
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackName}/*'
      Policies:

        # ---------------------------------------------------------------------
        # The fourteen services this stack touches. Actions are broad WITHIN each
        # service and the service list is closed - the deliberate trade. A
        # per-action allow-list reads better in a review but fails a deploy
        # halfway through the first time it is one verb short, and a half-built
        # stack with a Multi-AZ database in it is an expensive way to find out.
        #
        # What matters for least privilege is the line below this one: the role
        # cannot touch IAM except through the scoped policy that follows.
        # ---------------------------------------------------------------------
        - PolicyName: infrastructure-services
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: NetworkComputeStorageAndDelivery
                Effect: Allow
                Action:
                  - 'ec2:*'                       # VPC, subnets, routing, SGs, endpoints
                  - 'elasticloadbalancing:*'      # ALB, target groups, listeners
                  - 'ecs:*'                       # cluster, task definition, service
                  - 'ecr:*'                       # repository + lifecycle policy
                  - 'rds:*'                       # instance, subnet group, parameter group
                  - 's3:*'                        # image + artifact buckets
                  - 'cloudfront:*'                # distribution + origin access control
                  - 'logs:*'                      # log group
                  - 'cloudwatch:*'                # rollback alarm
                  - 'application-autoscaling:*'   # scalable target + policy
                  - 'codedeploy:*'                # application + deployment group
                  - 'codepipeline:*'              # pipeline
                  - 'events:*'                    # ECR push rule
                  - 'secretsmanager:*'            # RDS-managed master secret
                Resource: '*'

              # RDS StorageEncrypted and the RDS-managed secret both use AWS
              # managed keys. Creating them needs grant and describe calls.
              - Sid: KmsForEncryptedStorageAndSecrets
                Effect: Allow
                Action:
                  - kms:CreateGrant
                  - kms:DescribeKey
                  - kms:GenerateDataKey
                  - kms:GenerateDataKeyWithoutPlaintext
                  - kms:ListAliases
                  - kms:RetireGrant
                Resource: '*'

        # ---------------------------------------------------------------------
        # IAM, scoped. This is the half worth defending in a review: the role can
        # only create, modify or delete roles whose names begin with the project
        # prefix, and can only pass those same roles on to AWS services.
        # ---------------------------------------------------------------------
        - PolicyName: iam-scoped-to-this-project
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ManageProjectRolesOnly
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:UpdateRoleDescription
                  - iam:UpdateAssumeRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:ListRoleTags
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-*'

              # Handing the task roles to ECS, the pipeline role to CodePipeline,
              # and so on. Same prefix restriction.
              - Sid: PassProjectRolesToAwsServicesOnly
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${ProjectName}-*'
                Condition:
                  StringEquals:
                    iam:PassedToService:
                      - ecs-tasks.amazonaws.com
                      - codedeploy.amazonaws.com
                      - codepipeline.amazonaws.com
                      - events.amazonaws.com

              # The GitHub OIDC provider. Account-scoped resource, so it cannot
              # carry the project prefix - it is pinned by exact ARN instead.
              - Sid: ManageGitHubOidcProvider
                Effect: Allow
                Action:
                  - iam:CreateOpenIDConnectProvider
                  - iam:DeleteOpenIDConnectProvider
                  - iam:GetOpenIDConnectProvider
                  - iam:TagOpenIDConnectProvider
                  - iam:UntagOpenIDConnectProvider
                  - iam:UpdateOpenIDConnectProviderThumbprint
                  - iam:AddClientIDToOpenIDConnectProvider
                  - iam:RemoveClientIDFromOpenIDConnectProvider
                Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'

              # ECS, ELB, RDS and Application Auto Scaling each create a
              # service-linked role on first use. Restricted to those services.
              - Sid: ServiceLinkedRolesForTheServicesAbove
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: '*'
                Condition:
                  StringEquals:
                    iam:AWSServiceName:
                      - ecs.amazonaws.com
                      - elasticloadbalancing.amazonaws.com
                      - rds.amazonaws.com
                      - ecs.application-autoscaling.amazonaws.com

  # ===========================================================================
  # The Git sync role. This is what turns a push into a deployment: the sync
  # service assumes it, reads the repository through the connection, and creates
  # and executes a change set on the stack.
  #
  # It cannot build anything itself - it holds no ec2, rds, ecs or s3
  # permissions. All it can do is drive change sets and hand CloudFormation the
  # execution role above. That separation is the point: the thing triggered by a
  # git push has no power of its own.
  # ===========================================================================
  GitSyncRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-git-sync'
      Description: Assumed by CloudFormation Git sync to deploy this stack from GitHub.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: !Ref GitSyncServicePrincipal
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: read-the-repository
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Both action prefixes: the service was renamed from
              # codestar-connections to codeconnections and either may be the one
              # evaluated. Same permission, same resource - not a widening.
              - Sid: UseThisConnectionOnly
                Effect: Allow
                Action:
                  - codestar-connections:UseConnection
                  - codeconnections:UseConnection
                Resource: !Ref GitSyncConnectionArn

              # The repository link and sync configuration are separate resources
              # from the connection, created by the wizard, with their own ARNs.
              - Sid: ReadTheLinkAndSyncConfiguration
                Effect: Allow
                Action:
                  - codestar-connections:GetConnection
                  - codestar-connections:GetRepositoryLink
                  - codestar-connections:GetRepositorySyncStatus
                  - codestar-connections:GetSyncConfiguration
                  - codeconnections:GetConnection
                  - codeconnections:GetRepositoryLink
                  - codeconnections:GetRepositorySyncStatus
                  - codeconnections:GetSyncConfiguration
                Resource: '*'

        # ---------------------------------------------------------------------
        # Git sync reacts to pushes through an EventBridge rule that it creates
        # and owns. Without these three the wizard refuses the role outright,
        # before it ever tries to sync - the error names them explicitly.
        #
        # The rule name is chosen by the service, so this cannot be pinned to a
        # single rule; it is scoped to EventBridge rules in this account and
        # region, which is as tight as the service allows.
        # ---------------------------------------------------------------------
        - PolicyName: manage-the-sync-trigger
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: OwnTheSyncEventRule
                Effect: Allow
                Action:
                  - events:PutRule
                  - events:PutTargets
                  - events:DescribeRule
                  - events:DeleteRule
                  - events:RemoveTargets
                  - events:ListTargetsByRule
                  - events:TagResource
                Resource: !Sub 'arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/*'

        - PolicyName: drive-change-sets-on-this-stack
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ThisStackOnly
                Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:ListChangeSets
                  - cloudformation:CreateStack
                  - cloudformation:UpdateStack
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResource
                  - cloudformation:DescribeStackResources
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:TagResource
                  - cloudformation:UntagResource
                Resource:
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${StackName}/*'
                  - !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/*'

              # These two carry no resource, so they cannot be scoped. Both are
              # read-only and reveal nothing about existing stacks.
              - Sid: TemplateInspectionHasNoResourceForm
                Effect: Allow
                Action:
                  - cloudformation:ValidateTemplate
                  - cloudformation:ListStacks
                Resource: '*'

              # Handing the build over. The sync role cannot create resources
              # itself; it can only ask CloudFormation to do so as this one role.
              - Sid: PassOnlyTheExecutionRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CfnExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com

Outputs:
  GitSyncRoleArn:
    Description: >
      Select this as the Git sync IAM role instead of letting the console create
      one, or pass it to `codeconnections create-sync-configuration --role-arn`.
    Value: !GetAtt GitSyncRole.Arn
    Export:
      Name: !Sub '${ProjectName}-GitSyncRoleArn'
  CfnExecutionRoleArn:
    Description: >
      Select this as "IAM role for CloudFormation" when creating the Git sync
      configuration.
    Value: !GetAtt CfnExecutionRole.Arn
    Export:
      Name: !Sub '${ProjectName}-CfnExecutionRoleArn'
  CfnExecutionRoleName:
    Value: !Ref CfnExecutionRole
